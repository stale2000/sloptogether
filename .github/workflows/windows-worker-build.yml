name: Windows worker bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Parse Windows setup script
        run: |
          $parseErrors = @()
          $scripts = @(
            "workers/runtime/Setup-SlopTogetherWorker.ps1",
            "workers/runtime/Install-ComfyStreamerNodes.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += @($errors)
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw "PowerShell setup script has syntax errors."
          }

      - name: Build and package worker
        run: |
          $env:SLOPTOGETHER_PYTHON = (Get-Command python).Source
          ./workers/runtime/build-windows.ps1

      - name: Smoke test executable and bundle
        run: |
          ./workers/runtime/dist/SlopTogetherWorker.exe --help
          python -c "import zipfile; p='workers/runtime/dist/SlopTogetherWorker-windows-x64.zip'; z=zipfile.ZipFile(p); expected={'SlopTogetherWorker.exe','worker.example.toml','worker.wsl.example.toml','Setup-SlopTogetherWorker.ps1','Install-ComfyStreamerNodes.ps1','ComfyStreamer-Wsl-runtime.zip','README.txt'}; actual=set(z.namelist()); assert actual==expected, f'unexpected bundle files: {sorted(actual)}'"
          python -m unittest discover -s workers/runtime/tests -p "test_package_*.py"

      - uses: actions/upload-artifact@v7
        with:
          name: sloptogether-worker-windows-x64-unsigned
          path: workers/runtime/dist/SlopTogetherWorker-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
