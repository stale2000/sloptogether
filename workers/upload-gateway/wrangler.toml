name = "sloptogether-upload-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-23"
workers_dev = false

[[routes]]
pattern = "uploads.clips.gg"
custom_domain = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sloptogether-media"

[vars]
APP_ORIGIN = "https://sloptogether.vercel.app"

# Configure UPLOAD_GATEWAY_SECRET and UPLOAD_TICKET_KEY with `wrangler secret put`.
# Keep the bucket private and scope the deployment to the SlopTogether media bucket.
