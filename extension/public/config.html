<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>SlopTogether channel settings</title>
    <link rel="stylesheet" href="./extension.css" />
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script type="module" src="./config.js"></script>
  </head>
  <body>
    <main class="card" aria-labelledby="heading">
      <header class="brand-row">
        <span class="brand-mark" aria-hidden="true">S</span>
        <div><p class="eyebrow">CHANNEL SETTINGS</p><h1 id="heading">SlopTogether</h1></div>
      </header>
      <p id="status" class="status" role="status" aria-live="polite">Connecting to this channel…</p>
      <a id="settings-link" class="primary-link" href="https://www.clips.gg/sloptogether/control" target="_blank" rel="noopener noreferrer" hidden>Open channel controls ↗</a>
    </main>
  </body>
</html>
