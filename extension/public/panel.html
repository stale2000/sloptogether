<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Vote on the next approved SlopTogether scene." />
    <title>SlopTogether scene vote</title>
    <link rel="stylesheet" href="./extension.css" />
    <!-- Twitch requires its Extension Helper before every other script. -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script type="module" src="./panel.js"></script>
  </head>
  <body>
    <main class="card" aria-labelledby="heading">
      <header class="brand-row">
        <span class="brand-mark" aria-hidden="true">S</span>
        <div><p class="eyebrow">THE SCENE COLLECTIVE</p><h1 id="heading">Shape the next scene</h1></div>
      </header>
      <p id="status" class="status" role="status" aria-live="polite">Connecting to this channel…</p>
      <label id="stream-picker" class="stream-picker" hidden>Stream<select id="stream-select" aria-label="Stream"></select></label>
      <section id="turbo" class="turbo" aria-label="Optional Turbo render" aria-hidden="true" inert hidden>
        <h2>Optional Turbo render</h2>
        <p id="turbo-prompt" class="helper"></p>
        <div id="turbo-products" class="turbo-products"></div>
        <p id="turbo-status" class="note" role="status" aria-live="polite" hidden></p>
        <button id="turbo-link" class="secondary" type="button" hidden>Link account to use Bits</button>
        <button id="turbo-reconcile" class="secondary" type="button" hidden>Retry transaction check</button>
      </section>
      <section id="ballot" class="ballot" aria-label="Current scene vote" hidden>
        <div class="section-row"><h2 id="question">What happens next?</h2><span id="countdown" class="countdown"></span></div>
        <p id="helper" class="helper">Choose one scene.</p>
        <div id="choices" class="choices"></div>
        <button id="submit-vote" class="primary" type="button" disabled>Cast vote</button>
      </section>
      <section id="upcoming-scenes" class="upcoming-scenes" aria-label="Upcoming clips" hidden>
        <div class="upcoming-heading"><h2>Up next</h2><span id="upcoming-status" class="upcoming-status"></span></div>
        <div id="upcoming-list" class="upcoming-list"></div>
      </section>
      <section id="prompt-lock" class="prompt-lock" aria-label="Prompt Lock" hidden>
        <h2>Prompt Lock</h2>
        <div id="prompt-lock-products" class="prompt-lock-products"></div>
        <p id="prompt-lock-status" class="note" role="status" aria-live="polite" hidden></p>
        <button id="prompt-lock-link" class="secondary" type="button" hidden>Link account</button>
        <button id="prompt-lock-reconcile" class="secondary" type="button" hidden>Retry transaction check</button>
      </section>
      <section id="bits-eventsub-test" class="bits-eventsub-test" aria-label="Bits EventSub test" hidden>
        <button id="bits-eventsub-test-run" class="secondary" type="button" disabled>Run Bits test</button>
        <p id="bits-eventsub-test-status" class="note" role="status" aria-live="polite" hidden></p>
      </section>
      <section id="prompt-section" class="prompt-section" aria-label="Suggest a scene" hidden>
        <button id="prompt-toggle" class="prompt-toggle" type="button" aria-expanded="false" aria-controls="prompt-form">Suggest a scene</button>
        <div id="prompt-form" class="prompt-form" hidden>
          <label for="prompt-input">Prompt idea</label>
          <textarea id="prompt-input" maxlength="1000" rows="3" placeholder="Scene prompt" aria-label="Scene prompt"></textarea>
          <button id="submit-prompt" class="primary" type="button" disabled>Submit prompt</button>
        </div>
      </section>
      <section id="subscriber-card" class="subscriber-card" aria-label="Subscriber scene update" hidden></section>
      <section id="empty" class="empty" hidden><span aria-hidden="true">✦</span><p>Nothing to vote on yet.</p></section>
      <button id="link-account" class="secondary" type="button" hidden>Link account to vote</button>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
  </body>
</html>
